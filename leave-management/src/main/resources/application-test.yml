spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: true
    clean-disabled: false

leave:
  jwt:
    secret: TestSecretKeyForTestingPurposesOnlyMustBeAtLeast64BytesLong0000000
    expiration-ms: 3600000
  escalation:
    manager-timeout-minutes: 2880
    hr-timeout-minutes: 4320
    check-interval-ms: 300000
