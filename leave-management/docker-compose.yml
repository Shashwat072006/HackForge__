services:
  postgres:
    image: postgres:16-alpine
    container_name: leavedb
    environment:
      POSTGRES_DB: leavedb
      POSTGRES_USER: leaveuser
      POSTGRES_PASSWORD: leavepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaveuser -d leavedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
